name: Build reference data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target tools -t genomewalk-tools .
      - run: docker run --rm --network none genomewalk-tools test:data
      - name: Download, rebuild and validate public references
        run: >-
          docker run --rm
          --mount type=bind,source="$RUNNER_TEMP",target=/output
          genomewalk-tools data:refresh -- --jobs 4
          --data-dir /output/reference-inputs --out-dir /output/reference
      - name: Save the validated references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-data
          path: ${{ runner.temp }}/reference/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reference-data
          path: ${{ runner.temp }}/reference
      - name: Install the complete generated reference release
        run: rsync -a --delete "$RUNNER_TEMP/reference/" public/ref/
      - name: Validate, build and browser-test the updated site before committing
        run: docker build --target export --output "type=local,dest=$RUNNER_TEMP/reference-site" .
      - name: Commit validated references without overwriting newer work
        id: commit
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::main changed during this build. Rerun Build reference data on the latest main; no reference files were published."
            exit 1
          fi
          git add -A -- public/ref/
          if git diff --cached --quiet; then
            echo "The generated references are unchanged; no commit is needed." >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh public reference catalogues"
            git push origin HEAD:refs/heads/main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not trigger push workflows. An explicit dispatch does.
      # Also dispatch unchanged releases so a retry can recover a failed deployment.
      - name: Request deployment of the validated references
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Validated reference commit: $REFERENCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy site requested. The new references become live only after that workflow succeeds." >> "$GITHUB_STEP_SUMMARY"
