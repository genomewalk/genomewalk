name: Build reference data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target tools -t genomewalk-tools .
      - run: docker run --rm --network none genomewalk-tools test:data
      - name: Download, rebuild and validate public references
        run: >-
          docker run --rm
          --mount type=bind,source="$RUNNER_TEMP",target=/output
          genomewalk-tools data:refresh -- --jobs 4
          --data-dir /output/reference-inputs --out-dir /output/reference
      - name: Save the validated references for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-data
          path: ${{ runner.temp }}/reference/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
